name: omeeba_new
description: "A new Flutter project."

publish_to: 'none'


version: 1.0.4+11

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  flutter_svg: ^2.2.3
  get: ^4.7.3
  http: ^1.6.0
  dio: ^5.9.0
  gap: ^3.0.1
  flutter_screenutil: ^5.9.3
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  fluttertoast: ^9.0.0
  firebase_core: ^4.3.0
  readmore: ^3.0.0
  url_launcher:
  country_picker:
  pinput:
  flutter_staggered_grid_view: ^0.7.0
  video_player: ^2.9.2
  share_plus: ^10.1.2
  flutter_inappwebview: ^6.1.5
  flutter_mentions: ^2.0.1
  flutter_portal: ^0.4.0
  audio_waveforms: ^2.0.1
  cached_network_image: ^3.4.1
  insta_assets_picker: ^3.4.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  camera: ^0.11.3
  image_picker: ^1.2.1
  photo_manager: ^3.8.3
  permission_handler: ^12.0.1
  path: ^1.9.1
  video_thumbnail: ^0.5.6
  path_provider:
  ffmpeg_kit_flutter_new: ^4.1.0
  flutter_native_video_trimmer: ^1.1.9
  socket_io_client: ^2.0.3+1
  shimmer: ^3.0.0
  onesignal_flutter: ^5.4.1

  visibility_detector:
  connectivity_plus: ^6.0.5

  in_app_purchase: ^3.2.3
  in_app_purchase_android: ^0.4.0+8
  package_info_plus: ^9.0.0
  app_links: ^7.0.0

dev_dependencies:
  build_runner: ^2.4.15
  flutter_gen_runner: ^5.10.0
  flutter_lints: ^5.0.0
  change_app_package_name: ^1.5.0
  flutter_test:
    sdk: flutter

flutter_gen:
  integrations:
    flutter_svg: true
    lottie: true

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/icons/
    - assets/images/


flutter_intl:
  enabled: true

  fonts:
    - family: saansTrial
      fonts:
        - asset: assets/fonts/SaansTRIAL-Light.ttf
          weight: 300
        - asset: assets/fonts/SaansTRIAL-Regular.ttf
          weight: 400
        - asset: assets/fonts/SaansTRIAL-Medium.ttf
          weight: 500
        - asset: assets/fonts/SaansTRIAL-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SaansTRIAL-Bold.ttf
          weight: 700

# Patched: enable ExoPlayer software decoder fallback when hardware rejects a stream
# (fixes NO_EXCEEDS_CAPABILITIES on some devices, e.g. tall 1080p H.264).
dependency_overrides:
  video_player_android:
    path: packages/video_player_android